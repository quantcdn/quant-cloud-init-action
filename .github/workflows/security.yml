name: Security build and runtime checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --test security-tests/*.test.cjs
      - run: npm audit --omit=dev --audit-level=moderate
      - run: git diff --exit-code -- dist
